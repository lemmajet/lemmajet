services:
  postgres:
    build:
      context: ..
      dockerfile: postgres/Dockerfile
      target: runtime
      args:
        PG_MAJOR: ${PG_MAJOR:-17}
        LANGS: ${LANGS:-pl en de es fr cs}
        PROFILES: ${PROFILES:-xs_balanced sm_balanced md_balanced}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lemmajet}
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lemmajet}"]
      interval: 2s
      timeout: 3s
      retries: 15
