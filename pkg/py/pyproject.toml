[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lemmajet"
version = "0.7.0"
description = "Ultra-fast, zero-dependency micro-stemmers and micro-lemmatizers for 6 languages"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Michal Šrajer and LemmaJet Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://lemmajet.org"
Repository = "https://github.com/lemmajet/lemmajet"
Issues = "https://github.com/lemmajet/lemmajet/issues"

[tool.hatch.build.targets.sdist]
include = ["/src", "/docs", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/lemmajet"]

[tool.hatch.build.targets.wheel.shared-data]
"docs" = "docs"

[tool.ruff]
line-length = 100
target-version = "py39"

